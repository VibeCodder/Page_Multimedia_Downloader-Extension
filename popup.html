<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Page Multimedia Downloader</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="bar">
    <div class="bar-text">
      <h1>Page Multimedia Downloader</h1>
      <p id="status" class="status" aria-live="polite">List every image or video the current tab uses.</p>
    </div>
    <button id="modeBtn" class="btn btn-quiet" type="button" title="Download from addresses you paste instead of from the current page">Link mode</button>
    <button id="tabBtn" class="btn btn-quiet" type="button" title="Open this panel in a tab, so long downloads keep running">Open in tab</button>
    <button id="scanBtn" class="btn btn-primary" type="button">Find images</button>
  </header>

  <section id="progress" class="progress" hidden aria-live="polite">
    <div class="progress-head">
      <p id="progressLabel" class="progress-label">Downloading…</p>
      <button id="progressCancel" class="btn btn-cancel" type="button">Cancel</button>
    </div>
    <div class="progress-track">
      <div id="progressFill" class="progress-fill"></div>
    </div>
    <p id="progressText" class="progress-text">Starting…</p>
  </section>

  <section id="linkPanel" class="linkpanel" hidden>
    <label class="linkpanel-label" for="linkInput">One address per line: a video file, an .m3u8 or .mpd playlist, or an image.</label>
    <textarea id="linkInput" class="linkpanel-input" rows="3" spellcheck="false"
      placeholder="https://example.com/clip.mp4&#10;https://example.com/stream.m3u8"></textarea>
    <div class="linkpanel-row">
      <button id="linkClearBtn" class="btn" type="button">Clear</button>
      <button id="linkGoBtn" class="btn btn-primary" type="button">Check links</button>
    </div>
  </section>

  <div class="toolbar">
    <div class="toolbar-row">
      <div class="sort" id="typeControl">
        <span id="typeLabel">Data type</span>
        <div class="dropdown" id="typeDropdown">
          <button id="typeBtn" class="dropdown-btn" type="button" aria-haspopup="true" aria-expanded="false" aria-labelledby="typeLabel typeBtn">
            <span id="typeSummary">Images</span>
            <span class="dropdown-caret" aria-hidden="true"></span>
          </button>
          <div id="typeMenu" class="dropdown-menu" role="group" aria-labelledby="typeLabel" hidden>
            <label class="dropdown-item">
              <input type="checkbox" name="dataType" value="images" checked>
              <span>Images</span>
            </label>
            <label class="dropdown-item">
              <input type="checkbox" name="dataType" value="videos">
              <span>Videos</span>
            </label>
          </div>
        </div>
      </div>

      <div class="sort">
        <label for="sortSelect">Sort by</label>
        <select id="sortSelect">
          <option value="page">Page order</option>
          <option value="res-desc">Resolution (high to low)</option>
          <option value="res-asc">Resolution (low to high)</option>
          <option value="size-desc">File size (largest first)</option>
          <option value="size-asc">File size (smallest first)</option>
        </select>
      </div>
    </div>

    <div class="toolbar-row">
      <label class="check-label" for="selectAll">
        <input type="checkbox" id="selectAll" disabled>
        <span>Select all</span>
      </label>

      <button id="downloadSelectedBtn" class="btn btn-download toolbar-download" type="button" disabled>Download Selected</button>
    </div>
  </div>

  <main id="list" class="list" aria-label="Images found on this page"></main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="streams.js"></script>
  <script src="popup.js"></script>
</body>
</html>
